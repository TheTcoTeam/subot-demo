name: Process & Subtitle Video

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Telegram Chat ID"
        required: true
      status_msg_id:
        description: "Telegram Status Message ID"
        required: true
      video_msg_id:
        description: "Telegram Video Message ID"
        required: true
      thumb_msg_id:
        description: "Telegram Thumbnail Message ID"
        required: false
        default: "0"
      user_tag:
        description: "User Watermark Tag"
        required: true

jobs:
  render-subtitles:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (Cached)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Telegram MTProto Session & Persian Font
        uses: actions/cache@v4
        with:
          path: |
            session_cache
            fonts
          key: tg-bot-assets-${{ github.run_id }}
          restore-keys: |
            tg-bot-assets-
            tg-bot-session-

      - name: Fast Install FFmpeg, Font & Dependencies
        run: |
          mkdir -p session_cache fonts
          if ! command -v ffprobe &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg libass9
          fi
          if [ ! -s fonts/Vazirmatn-Bold.ttf ]; then
            wget -q -O fonts/Vazirmatn-Bold.ttf https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf/Vazirmatn-Bold.ttf || \
            wget -q -O fonts/Vazirmatn-Bold.ttf https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Bold.ttf
          fi
          pip install -q --prefer-binary -r requirements.txt

      - name: Run Video Subtitle Worker
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          STATUS_MSG_ID: ${{ github.event.inputs.status_msg_id }}
          VIDEO_MSG_ID: ${{ github.event.inputs.video_msg_id }}
          THUMB_MSG_ID: ${{ github.event.inputs.thumb_msg_id }}
          USER_TAG: ${{ github.event.inputs.user_tag }}
        run: python worker.py
